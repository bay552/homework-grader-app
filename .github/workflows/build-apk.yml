name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
        
    - name: Install buildozer requirements
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git ffmpeg libffi-dev libgtk-3-dev \
          libltdl-dev libmpg123-dev libsndfile1 \
          autoconf automake libtool pkg-config \
          build-essential libssl-dev libbz2-dev \
          libreadline-dev libsqlite3-dev wget curl llvm \
          libncursesw5-dev xz-utils tk-dev libxml2-dev \
          libxmlsec1-dev liblzma-dev zip unzip openjdk-11-jdk
        
    - name: Set up Java 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Configure Buildozer
      run: |
        # 确保 buildozer.spec 存在
        if [ ! -f buildozer.spec ]; then
          echo "Error: buildozer.spec not found!"
          exit 1
        fi
        
    - name: Build APK with Buildozer
      run: |
        export JAVA_HOME=/usr/lib/jvm/temurin-11-jdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        buildozer android debug
      timeout-minutes: 60
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: homework-grader-apk
        path: bin/*.apk
        if-no-files-found: error
        
    - name: Create Release (on tag)
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: bin/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
